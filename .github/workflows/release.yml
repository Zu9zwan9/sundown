name: Release

# Tag-triggered. Builds, signs and attaches the CLI tarball to a draft GitHub
# release. Nothing is notarised: the .app was removed on 2026-09-18, and a CLI
# fetched by a package manager never meets Gatekeeper's quarantine path.
#
# Required repository secrets:
#
#   MACOS_CERT_P12            Developer ID Application cert as .p12, base64'd:
#                               base64 -i DeveloperID.p12 | pbcopy
#   MACOS_CERT_PASSWORD       Password set when exporting that .p12
#   MACOS_KEYCHAIN_PASSWORD   Any random string; a throwaway keychain uses it
#
# That is the whole list. APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD were
# listed here until 2026-09-18 and no step has read them since the .app was
# removed. Setting them costs nothing and does nothing.
#
# SIGN_IDENTITY is not a secret. It is the certificate's common name, printed
# in every signed binary, so it has a default below and a secret only overrides
# it for forks signing under their own identity.
#
# Note: no provisioning profile. Those are for App Store and device builds.
# Developer ID direct distribution doesn't use one, and adding it to the
# recipe is a common way to waste an afternoon.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarise, publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: swift --version && xcodebuild -version && sw_vers

      # Gate the whole release on the tests. A signed broken build is worse
      # than no build, because it carries your identity.
      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"


      # release-cli.sh builds, signs, tars and records the checksum in
      # package.json. There is no .app to notarise any more — the GUI was
      # removed on 2026-09-18 in favour of the SwiftBar plugin.
      - name: Build and sign the CLI
        env:
          # Quoted: the identity contains ": ", which unquoted YAML reads
          # as a mapping and the whole file then fails to parse.
          SIGN_IDENTITY: "${{ secrets.SIGN_IDENTITY || 'Developer ID Application: BBMM TECHNOLOGIES INC. (KSDM65552F)' }}"
        run: ./Scripts/release-cli.sh

      # Tarball checksum for the Homebrew formula, printed where you can copy
      # it rather than recomputing by hand at 1am.
      - name: Source tarball checksum for the tap
        run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          echo "Formula url:    $URL"
          echo -n "Formula sha256: "
          curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/sundown-macos-*.tar.gz

      # Belt and braces: hosted runners are destroyed, but leaving a signing
      # identity in a keychain is not a habit worth having.
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
