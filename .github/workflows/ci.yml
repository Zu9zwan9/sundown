name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # macos-latest rather than a pinned image: the package declares its own
    # platform floor (macOS 14) and pins nothing else, so tracking the current
    # image catches toolchain drift early instead of hiding it behind a pin
    # that silently ages out. The Versions step makes the drift visible.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4


      - name: Versions
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      # The CLI must be safe to run unattended in CI. --dry-run changes
      # nothing by contract; if that ever stops being true, this job is where
      # it should be caught rather than on somebody's machine.
      - name: Dry run must not terminate anything
        run: |
          swift run sundown --dry-run --quiet
          swift run sundown --list-providers
          swift run sundown --calibrate

  format:
    name: Format
    # macos-latest rather than a pinned image: the package declares its own
    # platform floor (macOS 14) and pins nothing else, so tracking the current
    # image catches toolchain drift early instead of hiding it behind a pin
    # that silently ages out. The Versions step makes the drift visible.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # swift-format ships with the toolchain, so there is nothing to install
      # and nothing to pin.
      #
      # Format-then-diff rather than `lint`: the exit code is unambiguous, the
      # diff shows exactly what's wrong, and the fix is the same command the
      # contributor runs locally. `lint` reports findings a contributor then
      # has to translate into edits by hand.
      - name: Check formatting
        run: |
          swift format --in-place --recursive Sources Tests
          if ! git diff --exit-code; then
            echo
            echo "✗ Formatting differs. Run this and commit the result:"
            echo "    swift format --in-place --recursive Sources Tests"
            exit 1
          fi
          echo "✓ formatting clean"
